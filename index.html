<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spanish AI Hub - Keenetic Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-blue: #3b82f6;
            --bg-dark: #09090b;
            --card-bg: rgba(24, 24, 27, 0.8);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: #fafafa;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:active {
            transform: scale(0.95);
            border-color: var(--primary-blue);
        }

        .status-bar {
            background: rgba(24, 24, 27, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="p-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                Spanish AI Hub
            </h1>
            <p class="text-zinc-500 text-sm">Ваша мовна школа на Keenetic</p>
        </div>
        <div class="flex items-center gap-2">
            <a href="service.html" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-zinc-600 hover:text-zinc-400 transition-colors duration-200" title="Сервіс">
                <i class="fa-solid fa-screwdriver-wrench" style="font-size: 13px;"></i>
            </a>
            <a href="settings.html" class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-zinc-400">
                <i class="fa-solid fa-gear"></i>
            </a>
        </div>
    </header>

    <main class="flex-grow p-6 grid grid-cols-1 gap-4">
        
        <a href="listening.html" class="glass-card p-5 rounded-3xl flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-blue-500/10 flex items-center justify-center text-blue-400 text-xl">
                <i class="fa-solid fa-ear-listen"></i>
            </div>
            <div>
                <h3 class="font-semibold text-lg">Аудіювання</h3>
                <p class="text-zinc-500 text-sm">Слухайте та відповідайте на питання</p>
            </div>
        </a>

        <a href="verbs.html" class="glass-card p-5 rounded-3xl flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-400 text-xl">
                <i class="fa-solid fa-book-quran"></i>
            </div>
            <div>
                <h3 class="font-semibold text-lg">Тренажер дієслів</h3>
                <p class="text-zinc-500 text-sm">Відмінювання та граматика</p>
            </div>
        </a>

        <a href="phone.html" class="glass-card p-5 rounded-3xl flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-emerald-400 text-xl">
                <i class="fa-solid fa-phone-volume"></i>
            </div>
            <div>
                <h3 class="font-semibold text-lg">Телефонний розмовник</h3>
                <p class="text-zinc-500 text-sm">Симуляція дзвінка за темами</p>
            </div>
        </a>

        <a href="chat.html" class="glass-card p-5 rounded-3xl flex items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-purple-500/10 flex items-center justify-center text-purple-400 text-xl">
                <i class="fa-solid fa-comments"></i>
            </div>
            <div>
                <h3 class="font-semibold text-lg">Вільний чат</h3>
                <p class="text-zinc-500 text-sm">Розмова на будь-яку тему</p>
            </div>
        </a>

    </main>

    <footer class="status-bar p-6 rounded-t-3xl">
        <h4 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-4">Статус системи Keenetic</h4>
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
                <div class="flex justify-between text-xs text-zinc-400">
                    <span>CPU Load</span>
                    <span id="cpu-val">--%</span>
                </div>
                <div class="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
                    <div id="cpu-bar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
            <div class="space-y-2">
                <div class="flex justify-between text-xs text-zinc-400">
                    <span>RAM Free</span>
                    <span id="ram-val">-- MB</span>
                </div>
                <div class="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
                    <div id="ram-bar" class="h-full bg-indigo-500 transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // Функція для оновлення статусу роутера
        async function updateSystemStatus() {
            try {
                // Запит до нашого майбутнього API на Keenetic
                const response = await fetch('/status');
                const data = await response.json();
                
                document.getElementById('cpu-val').innerText = `${data.cpu}%`;
                document.getElementById('cpu-bar').style.width = `${data.cpu}%`;
                
                document.getElementById('ram-val').innerText = `${data.ram_free} MB`;
                // Припустимо, всього 256MB для розрахунку прогрес-бару
                const ramPercent = (data.ram_free / 256) * 100;
                document.getElementById('ram-bar').style.width = `${ramPercent}%`;
            } catch (e) {
                console.log("Статус недоступний (очікування запуску сервера на Keenetic)");
            }
        }

        // Оновлювати статус кожні 5 секунд
        setInterval(updateSystemStatus, 5000);
        updateSystemStatus();
    </script>
</body>
</html>
