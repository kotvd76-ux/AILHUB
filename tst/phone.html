        // --- Audio: TTS & STT ---
        // speakText() визначена глобально в sett_set.js.
        // Автоматично: очищує Markdown, визначає мову (кирилиця→uk-UA, решта→мова навчання),
        // підтримує online TTS (OpenAI) та offline (Web Speech API).

        function isLikelyMobileOrTablet() {
            const ua = navigator.userAgent || '';
            const coarsePointer = typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
            const touchPoints = navigator.maxTouchPoints || 0;
            const smallViewport = Math.min(window.innerWidth || 0, window.innerHeight || 0) <= 1024;
            const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
            const ipadDesktopUA = /Macintosh/i.test(ua) && touchPoints > 1;
            return uaMobile || ipadDesktopUA || (coarsePointer && smallViewport);
        }

        function setupSTT() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            sttTrace('setup:start', {
                hasSpeechRecognition: Boolean(SpeechRec),
                hasMediaDevices: Boolean(navigator.mediaDevices?.getUserMedia),
                secureContext: window.isSecureContext,
                userAgent: (navigator.userAgent || '').slice(0, 110),
            });
            if (!SpeechRec) {
                addLog("STT не підтримується", "error");
                document.getElementById('stt-status').innerText = "STT не підтримується у цьому браузері";
                sttTrace('setup:unsupported-browser');
                return;
            }

            // Mobile browsers (Android/iOS) do not support continuous=true reliably:
            // they auto-stop after silence and restart, which causes duplicate words.
            // On mobile: single-shot mode (continuous=false, interimResults=false) —
            // recognition stops automatically after the first utterance and submits.
            // On desktop: continuous mode — user manually presses stop to submit.
            const isMobile = isLikelyMobileOrTablet();

            recognition = new SpeechRec();
            recognition.lang = getLangConfig().speechLang;
            recognition.continuous = !isMobile;
            recognition.interimResults = !isMobile;
            recognition.maxAlternatives = 1;
            finalizedParts = [];
            sttTrace('setup:ready', {
                mode: isMobile ? 'mobile-single-shot' : 'desktop-continuous',
                lang: recognition.lang,
                continuous: recognition.continuous,
                interim: recognition.interimResults,
                maxAlternatives: recognition.maxAlternatives,
            });

            const mergeTranscriptPart = (parts, chunk) => {
                const normalized = (chunk || "").replace(/\s+/g, " ").trim();
                if (!normalized) return;
                const last = parts[parts.length - 1];
                if (last === normalized) return;
                if (last && normalized.startsWith(last)) {
                    parts[parts.length - 1] = normalized;
                    return;
                }
                parts.push(normalized);
            };

            const submitCurrentTranscript = () => {
                const text = (currentTranscript || '').trim();
                if (!text) {
                    sttTrace('submit:skipped-empty', { session: sttSessionSeq });
                    return false;
                }
                sttTrace('submit:ok', { session: sttSessionSeq, textLen: text.length });
                addMessage('user', text);
                runFeedback(text);
                sttSessionActive = false;
                sttManualStopRequested = false;
                finalizedParts = [];
                return true;
            };

            recognition.onstart = () => {
                sttSessionSeq += 1;
                isRecording = true;
                phoneAttemptStartedAt = Date.now();
                phoneAttemptNumber = phoneCompletedTurns + 1;
                setMicState('recording');
                document.getElementById('stt-status').innerText = formatListeningStatus(recognition.lang);
                addLog("Мікрофон активний");
                updateDraftClearButton();
                sttTrace('onstart', { session: sttSessionSeq, sttSessionActive, isMobile });
            };

            recognition.onresult = (e) => {
                sttTrace('onresult:batch', { session: sttSessionSeq, resultIndex: e.resultIndex, total: e.results?.length || 0 });
                let interimText = "";
                let finalsInBatch = 0;
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const result = e.results[i];
                    const text = (result[0]?.transcript || "").trim();
                    if (!text) continue;
                    if (result.isFinal) {
                        finalsInBatch += 1;
                        mergeTranscriptPart(finalizedParts, text);
                        gotFinal = true;
                    } else {
                        interimText += `${text} `;
                    }
                }
                const base = finalizedParts.join(" ").trim();
                currentTranscript = `${base}${interimText ? ` ${interimText.trim()}` : ""}`.trim();
                document.getElementById('transcript-preview').innerText = currentTranscript;
                updateDraftClearButton();
                sttTrace('onresult:merged', {
                    session: sttSessionSeq,
                    finalsInBatch,
                    finalizedParts: finalizedParts.length,
                    transcriptLen: currentTranscript.length,
                });

                // Мобільний: фінальний результат → зелений стан + 4с таймер авто-відправки
                // (натиснути кнопку під час зеленого стану = відправити негайно)
                if (isMobile && gotFinal && currentTranscript.trim()) {
                    clearTimeout(sttResultTimer);
                    setMicState('result');
                    sttResultTimer = setTimeout(() => {
                        sttResultTimer = null;
                        sttTrace('autosend:4s-timer', { session: sttSessionSeq });
                        submitCurrentTranscript();
                    }, 4000);
                }
            };

            recognition.onend = () => {
                // Azure Pronunciation Assessment керує своїм UI сам — не втручатись
                if (azurePronunciationActive) return;

                isRecording = false;
                addLog("Запис завершено");
                sttTrace('onend', {
                    session: sttSessionSeq,
                    shouldRestartCandidate: isMobile && sttSessionActive && !sttManualStopRequested,
                    sttSessionActive,
                    sttManualStopRequested,
                    transcriptLen: (currentTranscript || '').trim().length,
                });

                const shouldAutoRestart = isMobile && sttSessionActive && !sttManualStopRequested;
                if (shouldAutoRestart) {
                    // Таймер 4с вже запущений у onresult → зелений стан активний, не чіпаємо
                    if (sttResultTimer !== null) return;
                    // Немає таймера: або результату не було (тиша/no-speech) → рестарт,
                    // або щось пішло не так → завершити сесію.
                    if (submitCurrentTranscript()) return;
                    // Otherwise continue listening until we capture speech.
                    setTimeout(() => {
                        if (sttSessionActive && !isRecording) {
                            try {
                                recognition.start();
                                sttTrace('onend:restart', { session: sttSessionSeq });
                            } catch (_) {
                                // Ignore transient "already started" / permission race errors.
                                sttTrace('onend:restart-failed', { session: sttSessionSeq });
                            }
                        }
                    }, 300);
                    return;
                }

                if (sttManualStopRequested) {
                    submitCurrentTranscript();
                }

                sttSessionActive = false;
                sttManualStopRequested = false;

                finalizedParts = [];
                if (sttAutoSubmitTimer) {
                    clearTimeout(sttAutoSubmitTimer);
                    sttAutoSubmitTimer = null;
                }
            };

            recognition.onerror = (e) => {
                addLog(`STT Error: ${e.error}`, "error");
                sttTrace('onerror', {
                    session: sttSessionSeq,
                    code: e.error,
                    message: e.message || '',
                    sttSessionActive,
                    isRecording,
                });
                // Фатальні помилки — дозвіл відхилено, відновлення неможливе
                if (['not-allowed', 'service-not-allowed'].includes(e.error)) {
                    sttSessionActive = false;
                    sttManualStopRequested = false;
                    clearTimeout(sttResultTimer); sttResultTimer = null;
                    setMicState('idle');
                    document.getElementById('stt-status').innerText = 'Мікрофон заблоковано';
                    return;
                }
                // Нефатальні (no-speech, aborted, network): onend сам зробить тихий рестарт
            };
        }

        function replayLastPhrase() {
            if (lastAiMessage) speakText(lastAiMessage);
        }

        function submitCurrentTranscript() {
            if (!currentTranscript.trim()) return false; // нічого відправляти
            clearTimeout(sttResultTimer); sttResultTimer = null;
            sttSessionActive = false;
            const text = currentTranscript;
            currentTranscript = "";
            finalizedParts = [];
            addMessage('user', text);
            runFeedback(text);
            return true; // відправлено
        }

        function updateDraftClearButton() {
            const clearBtn = document.getElementById('clear-draft-btn');
            if (!clearBtn) return;
            const hasDraft = Boolean((currentTranscript || '').trim());
            clearBtn.disabled = !hasDraft;
            clearBtn.classList.toggle('opacity-40', !hasDraft);
            clearBtn.classList.toggle('cursor-not-allowed', !hasDraft);
        }

        function clearDraftTranscript() {
            currentTranscript = "";
            finalizedParts = [];
            document.getElementById('transcript-preview').innerText = "";
            updateDraftClearButton();
        }


        document.getElementById('record-btn').onclick = () => {
            sttTrace('record-btn:click', {
                currentType,
                isRecording,
                hasRecognition: Boolean(recognition),
                sttSessionActive,
                sttManualStopRequested,
            });
            // Echo + Azure Pronunciation Assessment
            if (currentType === 'echo' && !azurePronunciationActive) {
                const azCfg = (typeof getAzureSpeechConfig === 'function') ? getAzureSpeechConfig() : { key: '', region: '' };
                if (azCfg.key) {
                    if (isRecording) return; // ігноруємо повторне натискання
                    startAzurePronunciationAssessment(azCfg.key, azCfg.region);
                    return;
                }
            }
            // Зелений стан: таймер тікає → тап = відправити негайно
            if (sttResultTimer !== null) {
                submitCurrentTranscript();
                return;
            }
            // Стандартний Web Speech API
            if (!recognition) setupSTT();
            if (!recognition) {
                const azCfg = (typeof getAzureSpeechConfig === 'function') ? getAzureSpeechConfig() : { key: '' };
                if (!azCfg.key) {
                    alert('Цей браузер не підтримує STT. Спробуй Chrome на Android або додай Azure Speech ключ у Налаштуваннях.');
                } else {
                    alert('Web Speech API недоступний. Для мобільного STT у цьому браузері увімкни вправу Echo (Azure).');
                }
                return;
            }
            if (isRecording) {
                sttManualStopRequested = true;
                addLog('STT: ручна зупинка запису');
                try {
                    recognition.stop();
                    sttTrace('record-btn:stop-requested', { session: sttSessionSeq });
                    // Chrome Android occasionally misses onend after stop().
                    // Fail-safe to unblock UI and submit transcript if we already have text.
                    setTimeout(() => {
                        if (!isRecording) return;
                        sttTrace('record-btn:stop-timeout-fallback', {
                            session: sttSessionSeq,
                            transcriptLen: (currentTranscript || '').trim().length,
                        });
                        isRecording = false;
                        document.getElementById('mic-ring').classList.add('hidden');
                        document.getElementById('mic-icon').className = 'fa-solid fa-microphone';
                        document.getElementById('stt-status').innerText = '';
                        const text = (currentTranscript || '').trim();
                        if (text) {
                            addMessage('user', text);
                            runFeedback(text);
                        }
                        sttSessionActive = false;
                        sttManualStopRequested = false;
                        finalizedParts = [];
                    }, 1600);
                } catch (e) {
                    addLog(`STT stop() помилка: ${e.message || e}`, 'error');
                }
            } else {
                window.speechSynthesis.cancel();
                currentTranscript = "";
                finalizedParts = [];
                document.getElementById('transcript-preview').innerText = "";
                updateDraftClearButton();
                document.getElementById('feedback-sheet').classList.add('hidden');
                sttSessionActive = true;
                sttManualStopRequested = false;
                addLog(`STT: старт запису (${currentType || 'unknown'})`);
                const doStart = () => {
                    try {
                        recognition.start();
                    } catch (e) {
                        addLog(`STT start() помилка: ${e.message || e} — перестворення`, 'error');
                        recognition = null; // наступний клік зробить setupSTT знову
                        sttSessionActive = false;
                        sttManualStopRequested = false;
                        setMicState('idle');
                    }
                };
                // Якщо recognition щойно створено — один тік для ініціалізації
                if (isFirstSetup) setTimeout(doStart, 0); else doStart();
            }
        };

        async function startAzurePronunciationAssessment(key, region) {
            if (azurePronunciationActive) return;

            // Зупиняємо Web Speech якщо ще активний, щоб не перехоплював мікрофон
            sttSessionActive = false;
            sttManualStopRequested = false;
            if (recognition) {
                try { recognition.stop(); } catch (_) {}
            }
            // На мобільному браузер повільно звільняє мікрофон після stop()
            await new Promise(r => setTimeout(r, 400));

            azurePronunciationActive = true;
            isRecording = true;

            const targetPhrase = lastAiMessage || '';
            const lang = (typeof getLangConfig === 'function') ? getLangConfig().speechLang : 'es-ES';

            document.getElementById('mic-ring').classList.remove('hidden');
            document.getElementById('mic-icon').className = 'fa-solid fa-square text-4xl text-white';
            document.getElementById('stt-status').innerText = '🎤 ГОВОРИ ФРАЗУ…';
            document.getElementById('feedback-sheet').classList.add('hidden');
            currentTranscript = '';
            document.getElementById('transcript-preview').innerText = '';
            updateDraftClearButton();

            try {
                if (typeof AzureSpeechConnector === 'undefined') throw new Error('AzureSpeechConnector не знайдено');
                addLog('Azure Pronunciation Assessment запущено…');
                const scores = await AzureSpeechConnector.assessPronunciation(key, region, targetPhrase, lang);

                // NoMatch — всі бали 0 і нема транскрипту → повторний спробуй
                if (!scores.transcript && scores.pronunciationScore === 0) {
                    addLog('Azure: мова не розпізнана (тишина або шум), спробуй ще раз', 'warn');
                    const fallbackOk = await fallbackEchoWithWebSpeech();
                    if (!fallbackOk) {
                        document.getElementById('transcript-preview').innerText = '(не розпізнано — спробуй ще)';
                        updateDraftClearButton();
                    }
                    return;
                }

                addLog(`Azure: acc=${scores.accuracyScore} flu=${scores.fluencyScore} comp=${scores.completenessScore} pros=${scores.prosodyScore} overall=${scores.pronunciationScore}`, 'success');

                currentTranscript = scores.transcript;
                document.getElementById('transcript-preview').innerText = scores.transcript;
                updateDraftClearButton();
                addMessage('user', scores.transcript);

                phoneAttemptNumber = phoneCompletedTurns + 1;
                _phoneSetAiActive(true);
                await runEchoFeedback(scores.transcript, scores);
            } catch (e) {
                addLog('Azure assessment помилка: ' + e.message, 'error');
                const isAuth = /401|AuthenticationFailure|auth/i.test(e.message);
                document.getElementById('transcript-preview').innerText = isAuth
                    ? '⚠️ Azure ключ невірний або прострочений — перевір Налаштування'
                    : '❌ Azure помилка: ' + e.message;
                updateDraftClearButton();
            } finally {
                azurePronunciationActive = false;
                isRecording = false;
                _phoneSetAiActive(false);
                document.getElementById('mic-ring').classList.add('hidden');
                document.getElementById('mic-icon').className = 'fa-solid fa-microphone text-4xl text-white';
                document.getElementById('stt-status').innerText = '';
            }
        }

        async function fallbackEchoWithWebSpeech() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                addLog('Fallback STT: Web Speech API недоступний', 'warn');
                return false;
            }

            addLog('Fallback STT: пробуємо Web Speech API…', 'warn');
            return await new Promise(resolve => {
                let done = false;
                const finish = (ok) => {
                    if (done) return;
                    done = true;
                    resolve(ok);
                };

                try {
                    const r = new SpeechRec();
                    r.lang = (typeof getLangConfig === 'function') ? getLangConfig().speechLang : 'en-US';
                    r.interimResults = false;
                    r.continuous = false;
                    r.maxAlternatives = 1;

                    r.onresult = (e) => {
                        const text = (e.results?.[0]?.[0]?.transcript || '').trim();
                        if (!text) return;
                        currentTranscript = text;
                        document.getElementById('transcript-preview').innerText = text;
                        updateDraftClearButton();
                        addMessage('user', text);
                        phoneAttemptNumber = phoneCompletedTurns + 1;
                        _phoneSetAiActive(true);
                        runEchoFeedback(text).finally(() => _phoneSetAiActive(false));
                        addLog('Fallback STT: розпізнавання успішне', 'success');
                        finish(true);
                    };

                    r.onerror = (e) => {
                        addLog(`Fallback STT error: ${e.error}`, 'warn');
                        finish(false);
                    };

                    r.onend = () => setTimeout(() => finish(Boolean((currentTranscript || '').trim())), 0);
                    r.start();
                    setTimeout(() => finish(false), 9000);
                } catch (e) {
                    addLog(`Fallback STT exception: ${e.message || e}`, 'warn');
                    finish(false);
                }
            });
        }

        // --- Helpers ---
        function updateExerciseInvite(text = '') {
            const invite = document.getElementById('exercise-invite');
            if (!invite) return;
            const normalized = (text || '').replace(/\s+/g, ' ').trim();
            invite.innerText = normalized || 'Тут зʼявиться фраза від ШІ.';
        }

        function addMessage(sender, text) {
            const area = document.getElementById('scroll-area');
            const div = document.createElement('div');
            div.className = `p-2.5 rounded-xl max-w-full animate-in slide-in-from-bottom-2 duration-300 ${sender === 'ai' ? 'chat-bubble-ai self-start' : 'chat-bubble-user self-end ml-auto'}`;
            div.innerHTML = `<p>${text}</p>`;
            area.appendChild(div);
            area.scrollTo({ top: area.scrollHeight, behavior: 'smooth' });
            if (sender === 'ai') updateExerciseInvite(text);
        }

        async function generateScene(desc) {
            const container = document.getElementById('scene-image');
            container.innerHTML = `<div class="animate-pulse text-orange-500 text-[10px] font-bold">ГЕНЕРУЄМО СЦЕНУ...</div>`;

            const prompt = `Simple educational scene illustration, no text: ${desc}`;
            const imageModelSetting = localStorage.getItem('sp_image_model') || 'pollinations';

            // ── Допоміжна функція: fetch з таймаутом ────────────
            const fetchWithTimeout = (url, options, timeoutMs) => {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), timeoutMs);
                return fetch(url, { ...options, signal: ctrl.signal })
                    .finally(() => clearTimeout(timer));
            };

            // ── Google Gemini 2.5 Flash Image (Nano Banana) — прямий виклик ──
            if (imageModelSetting === 'gemini-image') {
                const googleKey = (localStorage.getItem('sp_api_key_google_img') || '').trim()
                               || ((typeof getApiKey === 'function') ? getApiKey('google') : (localStorage.getItem('sp_api_key_google') || ''));
                addLog('Генерація зображення. Модель: gemini-2.5-flash-image (Nano Banana)');
                if (!googleKey) {
                    addLog('Google API ключ не вказано в налаштуваннях → Pollinations', 'error');
                } else {
                    try {
                        const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${googleKey}`;
                        const res = await fetchWithTimeout(geminiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                generationConfig: { responseModalities: ['IMAGE'] }
                            })
                        }, 60000);
                        if (!res.ok) {
                            const err = await res.text();
                            addLog(`Gemini Image error ${res.status}: ${err.slice(0, 200)}`, 'error');
                            throw new Error(`Gemini ${res.status}`);
                        }
                        const data = await res.json();
                        const imgPart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
                        if (!imgPart) throw new Error('Gemini: no image in response');
                        const { mimeType, data: b64 } = imgPart.inlineData;
                        container.innerHTML = `<img src="data:${mimeType};base64,${b64}" class="w-full h-full object-cover rounded-lg">`;
                        addLog('Картинку згенеровано (Gemini)', 'success');
                        return;
                    } catch (e) {
                        addLog(`Gemini Image помилка: ${e.message} → Pollinations`, 'error');
                    }
                }
            }

            // ── Hugging Face Inference API (прямий виклик, HF підтримує CORS) ──
            if (imageModelSetting.startsWith('hf:')) {
                const hfModel = imageModelSetting.slice(3);
                const hfToken = localStorage.getItem('sp_api_key_hf') || '';
                addLog(`Генерація зображення. Модель: ${hfModel}`);
                if (!hfToken) {
                    addLog('HF токен не вказано в налаштуваннях → Pollinations', 'error');
                } else {
                    let hfOk = false;
                    for (let attempt = 1; attempt <= 3; attempt++) {
                        try {
                            const hfUrl = `https://api-inference.huggingface.co/models/${hfModel}`;
                            const res = await fetchWithTimeout(hfUrl, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${hfToken}`
                                },
                                body: JSON.stringify({ inputs: prompt })
                            }, 30000); // 30с таймаут
                            if (res.status === 503) {
                                const body = await res.json().catch(() => ({}));
                                const wait = Math.min((body.estimated_time || 20), 30);
                                addLog(`HF: модель завантажується, чекаємо ${wait}с... (спроба ${attempt}/3)`);
                                container.innerHTML = `<div class="animate-pulse text-orange-500 text-[10px] font-bold">МОДЕЛЬ ЗАВАНТАЖУЄТЬСЯ... (${wait}с)</div>`;
                                await new Promise(r => setTimeout(r, wait * 1000));
                                continue;
                            }
                            if (!res.ok) {
                                const err = await res.text();
                                addLog(`HF error ${res.status}: ${err.slice(0, 200)}`, 'error');
                                throw new Error(`HF ${res.status}`);
                            }
                            const blob = await res.blob();
                            container.innerHTML = `<img src="${URL.createObjectURL(blob)}" class="w-full h-full object-cover rounded-lg">`;
                            addLog('Картинку згенеровано', 'success');
                            hfOk = true;
                            break;
                        } catch (e) {
                            addLog(`HF помилка (спроба ${attempt}/3): ${e.message}`, 'error');
                            if (attempt === 3) addLog('HF вичерпав спроби → Pollinations');
                        }
                    }
                    if (hfOk) return;
                }
            }

            // ── OpenAI Images API ────────────────────────────────
            if (imageModelSetting.startsWith('openai:')) {
                const oaiModel = imageModelSetting.slice(7);
                const SK = (typeof SETTINGS_CONFIG !== 'undefined') ? SETTINGS_CONFIG.storageKeys : {};
                const oaiKey = (localStorage.getItem(SK.apiKeyOpenaiImg || 'sp_api_key_openai_img') || '').trim()
                            || getConfig().apiKeys.openai;
                addLog(`Генерація зображення. Модель: ${oaiModel}`);
                if (!oaiKey) {
                    addLog('OpenAI ключ не вказано → Pollinations', 'error');
                } else {
                    try {
                        const res = await fetch('https://api.openai.com/v1/images/generations', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${oaiKey}`, 'Content-Type': 'application/json' },
                            body: JSON.stringify({ model: oaiModel, prompt, n: 1, size: '1024x1024' })
                        });
                        if (!res.ok) { const err = await res.text(); throw new Error(`OpenAI ${res.status}: ${err.slice(0,200)}`); }
                        const data = await res.json();
                        const imgData = data.data?.[0];
                        const src = imgData?.url || (imgData?.b64_json ? `data:image/png;base64,${imgData.b64_json}` : null);
                        if (!src) throw new Error('OpenAI: відповідь без зображення');
                        container.innerHTML = `<img src="${src}" class="w-full h-full object-cover rounded-lg">`;
                        addLog('Картинку згенеровано', 'success');
                        return;
                    } catch (e) {
                        addLog(`OpenAI помилка: ${e.message}`, 'error');
                        addLog('OpenAI → Pollinations');
                    }
                }
            }

            // ── Google Imagen API ────────────────────────────────
            if (imageModelSetting.startsWith('google:')) {
                const gModel = imageModelSetting.slice(7);
                const SK2 = (typeof SETTINGS_CONFIG !== 'undefined') ? SETTINGS_CONFIG.storageKeys : {};
                const gKey = (localStorage.getItem(SK2.apiKeyGoogleImg || 'sp_api_key_google_img') || '').trim()
                           || getConfig().apiKeys.google;
                addLog(`Генерація зображення. Модель: ${gModel}`);
                if (!gKey) {
                    addLog('Google API ключ не вказано → Pollinations', 'error');
                } else {
                    try {
                        const res = await fetch(
                            `https://generativelanguage.googleapis.com/v1beta/models/${gModel}:generateImages?key=${gKey}`,
                            {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ prompt: { text: prompt }, imageCount: 1 })
                            }
                        );
                        if (!res.ok) { const err = await res.text(); throw new Error(`Google Imagen ${res.status}: ${err.slice(0,300)}`); }
                        const data = await res.json();
                        const b64 = data.generatedImages?.[0]?.image?.imageBytes;
                        if (!b64) throw new Error(`Google Imagen: відповідь без зображення. Ключі відповіді: ${Object.keys(data).join(', ')}`);
                        container.innerHTML = `<img src="data:image/png;base64,${b64}" class="w-full h-full object-cover rounded-lg">`;
                        addLog('Картинку згенеровано', 'success');
                        return;
                    } catch (e) {
                        if (e instanceof TypeError) {
                            addLog(`Google Imagen: мережева помилка (CORS або модель недоступна через Gemini API — можливо потрібен Vertex AI): ${e.message}`, 'error');
                        } else {
                            addLog(`Google Imagen помилка: ${e.message}`, 'error');
                        }
                        addLog('Google Imagen → Pollinations');
                    }
                }
            }

            // ── Pollinations.ai (fallback або основний варіант) ──
            addLog('Генерація зображення. Сервіс: Pollinations.ai');
            const polImgModel = localStorage.getItem('sp_pollinations_img_model') || 'flux';
            const polToken    = (typeof getApiKey === 'function') ? getApiKey('pollinations') : (localStorage.getItem('sp_api_key_pollinations') || '');
            const pollinationsModels = [polImgModel, 'flux'].filter((v, i, arr) => v && arr.indexOf(v) === i);
            for (let attempt = 1; attempt <= 3; attempt++) {
                const tryModel = pollinationsModels[(attempt - 1) % pollinationsModels.length];
                const trySeed = Math.floor(Math.random() * 1_000_000);
                try {
                    const res = await fetchWithTimeout('/pol-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            prompt,
                            model: tryModel,
                            seed: trySeed,
                            width: 480,
                            height: 320,
                            token: polToken || undefined
                        })
                    }, 60000);
                    if (!res.ok) {
                        const errTxt = await res.text().catch(() => '');
                        throw new Error(`Pollinations ${res.status}${errTxt ? `: ${errTxt.slice(0, 140)}` : ''}`);
                    }
                    const blob = await res.blob();
                    container.innerHTML = `<img src="${URL.createObjectURL(blob)}" class="w-full h-full object-cover rounded-lg">`;
                    addLog(`Картинку згенеровано (Pollinations, model=${tryModel})`, 'success');
                    return;
                } catch (e) {
                    addLog(`Pollinations помилка (спроба ${attempt}/3, model=${tryModel}): ${e.message}`, 'error');
                    if (attempt < 3) await new Promise(r => setTimeout(r, attempt * 5000));
                }
            }
            container.innerHTML = `<span class="text-slate-600 text-xs italic">Зображення недоступне</span>`;
        }

        window.onload = async () => {
            if (typeof loadCentralSettings === 'function') await loadCentralSettings();
            const levelSelect = document.getElementById('level-select');
            const defaultLevel = (typeof getDefaultExerciseLevel === 'function')
                ? getDefaultExerciseLevel(PHONE_ALLOWED_LEVELS)
                : 'B1';
            if (levelSelect && PHONE_ALLOWED_LEVELS.includes(defaultLevel)) {
                levelSelect.value = defaultLevel;
                currentLevel = defaultLevel;
            }

            buildThemeDropdown();
            updateGameOptions();
            addLog(`Тренажер готовий до роботи (дефолтний рівень: ${currentLevel})`);

            // Показуємо кнопки діагностики якщо сервіс режим або техлог увімкнено
            const _phoneServiceMode = localStorage.getItem('sp_service_mode') === '1'
                || localStorage.getItem('sp_techlog_enabled') === '1';
            const _phoneDiagBtn = document.getElementById('phone-diag-btn');
            if (_phoneDiagBtn) _phoneDiagBtn.style.display = _phoneServiceMode ? 'block' : 'none';
            const _phoneDiagHdrBtn = document.getElementById('phone-diag-hdr-btn');
            if (_phoneDiagHdrBtn) _phoneDiagHdrBtn.style.display = _phoneServiceMode ? '' : 'none';
            const _phoneLoaderDiagLink = document.getElementById('phone-loader-diag-link');
            if (_phoneLoaderDiagLink) _phoneLoaderDiagLink.style.display = _phoneServiceMode ? 'flex' : 'none';
        };
    </script>
</body>
</html>
