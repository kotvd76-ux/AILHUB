              <div style={{width:'100%',maxWidth:440,background:'rgba(255,255,255,0.04)',border:'2px solid '+(nadOn?'rgba(74,158,222,0.5)':'rgba(255,255,255,0.1)'),borderRadius:16,padding:'16px 18px',transition:'border-color .2s'}}>
                <div style={{display:'flex',alignItems:'center',gap:14}}>
                  <span style={{fontSize:'1.4rem'}}>🎙</span>
                  <div style={{flex:1}}>
                    <div style={{color:'#fff',fontWeight:700,fontSize:'0.95rem'}}>Живий голосовий режим</div>
                    <div style={{color:'#8892b0',fontSize:'0.8rem',marginTop:2}}>{provLabel}{recHint}</div>
                  </div>
                  <button onClick={()=>setNadOn(x=>!x)} aria-pressed={nadOn} aria-label="Увімкнути живий голосовий режим"
                    style={{width:50,height:28,borderRadius:14,border:'none',cursor:'pointer',padding:3,background:nadOn?'#4a9ede':'rgba(255,255,255,0.15)',transition:'background .2s',flexShrink:0,position:'relative'}}>
                    <div style={{width:22,height:22,borderRadius:'50%',background:'#fff',transition:'transform .2s',transform:nadOn?'translateX(22px)':'translateX(0)'}}/>
                  </button>
                </div>
                {nadOn&&(
                  <p style={{marginTop:10,color:'#fbbf24',fontSize:'0.8rem',lineHeight:1.55}}>
                    ⚠️ Сесія обмежена {cfg.sessionMaxMin||10} хв · Корекція помилок вбудована в мовлення
                  </p>
                )}
              </div>
            );
          })()}

          {/* Файл прогресу (урок) */}
          {mode.id==='lesson'&&(
            <div style={{width:'100%',maxWidth:440}}>
              <label style={{color:'#8892b0',fontSize:'0.75rem',textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700,display:'block',marginBottom:10}}>Файл прогресу (необов'язково)</label>
              <label style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',background:'rgba(255,255,255,0.05)',border:'2px dashed '+(lesFile?'#4a9ede':'rgba(255,255,255,0.2)'),borderRadius:14,cursor:'pointer'}}>
                <span style={{fontSize:'1.5rem'}}>{lesFile?'📄':'📂'}</span>
                <div style={{flex:1}}>
                  <div style={{color:lesFile?'#4a9ede':'#8892b0',fontSize:'0.95rem'}}>{lesFile||'.txt / .json файл'}</div>
                  {!lesFile&&<div style={{color:'#4b5563',fontSize:'0.8rem',marginTop:2}}>результати тестів, нотатки</div>}
                </div>
                {lesFile&&<button onClick={e=>{e.preventDefault();setLesFile(null);setLesText('');}} aria-label="Видалити файл" style={{background:'rgba(248,113,113,0.2)',border:'none',borderRadius:8,padding:'5px 10px',color:'#f87171',cursor:'pointer',fontSize:'0.85rem'}}>✕</button>}
                <input type="file" accept=".txt,.json,.md" onChange={onFile} style={{display:'none'}}/>
              </label>
              {lesText&&<p style={{marginTop:8,color:'#4ade80',fontSize:'0.88rem'}}>✓ AI врахує ваш прогрес</p>}
            </div>
          )}

          {/* Вимова: вибір теми (необов'язково) */}
          {mode.id==='pronunciation'&&(
            <div style={{width:'100%',maxWidth:440}}>
              <label style={{color:'#8892b0',fontSize:'0.75rem',textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700,display:'block',marginBottom:10}}>Тема тексту (необов'язково)</label>
              <select value={pronTheme} onChange={e=>setPronTheme(e.target.value)}
                style={{width:'100%',background:'rgba(255,255,255,0.08)',border:'2px solid rgba(255,255,255,0.16)',borderRadius:12,padding:'13px 15px',color:'#fff',fontSize:'1rem',outline:'none',cursor:'pointer'}}>
                <option value="">🎲 Довільна тема</option>
                {(SETTINGS_CONFIG.priorityThemes||[]).map(t=>{
                  const v = typeof t==='object' ? t.value : t;
                  const lbl = typeof t==='object' ? t.label : t;
                  return <option key={v} value={v}>{lbl}</option>;
                })}
              </select>
              <p style={{marginTop:8,color:'#8892b0',fontSize:'0.82rem'}}>Текст буде на рівні {sessLevel} · ~40-60 слів</p>
              <div style={{display:'flex',gap:8,marginTop:12}}>
                <button onClick={()=>setPronSource('ai')}
                  style={{flex:1,padding:'13px 8px',borderRadius:12,border:'2px solid '+(pronSource==='ai'?'rgba(167,139,250,0.7)':'rgba(255,255,255,0.12)'),background:pronSource==='ai'?'rgba(167,139,250,0.14)':'rgba(255,255,255,0.04)',color:pronSource==='ai'?'#c4b5fd':'#8892b0',fontWeight:pronSource==='ai'?700:400,fontSize:'0.88rem',cursor:'pointer',transition:'all .15s'}}>
                  🤖 Генерувати текст
                </button>
                <label style={{flex:1,padding:'13px 8px',borderRadius:12,border:'2px solid '+(pronSource==='file'?'rgba(167,139,250,0.7)':'rgba(255,255,255,0.12)'),background:pronSource==='file'?'rgba(167,139,250,0.14)':'rgba(255,255,255,0.04)',color:pronSource==='file'?'#c4b5fd':'#8892b0',fontWeight:pronSource==='file'?700:400,fontSize:'0.88rem',cursor:'pointer',textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:6,transition:'all .15s'}}>
                  📄 Завантажити .txt
                  <input type="file" accept=".txt" onChange={e=>{
                    const f=e.target.files?.[0]; if(!f) return;
                    const r=new FileReader();
                    r.onload=ev=>{setPronText((ev.target.result||'').trim());setPronFileName(f.name);setPronSource('file');};
                    r.readAsText(f);
                  }} style={{display:'none'}}/>
                </label>
              </div>
              {pronSource==='file'&&pronFileName&&(
                <p style={{marginTop:6,color:'#4ade80',fontSize:'0.82rem'}}>✓ {pronFileName}</p>
              )}
            </div>
          )}

          {/* Аспекти тесту */}
          {mode.id==='test'&&(
            <div style={{width:'100%',maxWidth:440}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <span style={{color:'#8892b0',fontSize:'0.75rem',textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:700}}>Аспекти тестування</span>
                <div style={{display:'flex',gap:6}}>
                  {[['Всі',ASPECTS_UI.map(a=>a.id)],['Жоден',[]]].map(([lbl,val])=>(
                    <button key={lbl} onClick={()=>setSelAsp(val)} style={{padding:'5px 12px',borderRadius:8,border:'1px solid rgba(255,255,255,0.14)',background:'rgba(255,255,255,0.06)',color:'#8892b0',fontSize:'0.82rem',cursor:'pointer',minHeight:36}}>
                      {lbl}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:8}} role="group">
                {ASPECTS_UI.map(a=>{
                  const on=selAsp.includes(a.id);
                  const n=(CHAT_CONFIG.aspects.find(x=>x.id===a.id)||{questions:5}).questions;
                  return (
                    <button key={a.id} onClick={()=>setSelAsp(p=>on?p.filter(x=>x!==a.id):[...p,a.id])} aria-pressed={on}
                      style={{display:'flex',alignItems:'center',gap:14,padding:'13px 14px',borderRadius:12,border:'2px solid '+(on?a.color+'66':'rgba(255,255,255,0.09)'),background:on?a.color+'14':'rgba(255,255,255,0.04)',cursor:'pointer',textAlign:'left',transition:'all .15s'}}>
                      <span style={{fontSize:'1.15rem'}}>{a.icon}</span>
                      <span style={{flex:1,color:on?'#fff':'#8892b0',fontWeight:on?700:400,fontSize:'0.95rem'}}>{a.label}</span>
                      <span style={{color:'#4b5563',fontSize:'0.78rem',marginRight:6}}>{n} пит.</span>
                      <div style={{width:22,height:22,borderRadius:'50%',border:'2px solid '+(on?a.color:'rgba(255,255,255,0.2)'),background:on?a.color:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'0.7rem',color:'#fff'}} aria-hidden="true">{on?'✓':''}</div>
                    </button>
                  );
                })}
              </div>
              {selAsp.length>0&&<p style={{marginTop:10,color:'#8892b0',fontSize:'0.85rem',textAlign:'center'}}>{selAsp.length} аспектів · ~{selAsp.reduce((s,id)=>s+(CHAT_CONFIG.aspects.find(x=>x.id===id)||{questions:5}).questions,0)} питань</p>}
            </div>
          )}

          <button onClick={()=>{if(mode.id==='test'){if(selAsp.length>0)startTest(selAsp);}else if(mode.id==='pronunciation'){startPronunciation();}else{startSess();}}}
            disabled={mode.id==='test'&&selAsp.length===0}
            style={{background:mode.id==='test'&&selAsp.length===0?'rgba(255,255,255,0.1)':mode.color,border:'none',borderRadius:16,padding:'15px 0',color:'#fff',fontSize:'1rem',fontWeight:700,cursor:mode.id==='test'&&selAsp.length===0?'default':'pointer',width:'100%',maxWidth:440}}>
            Почати →
          </button>
        </div>
      </main>
    </div>
  );

  /* TEST */
  if(screen==='test'){
    const curAsp = qs[qi]?ASPECTS_UI.find(a=>a.id===qs[qi].aspect):null;
    if(testPh==='generating') return (
      <div style={{minHeight:'100vh',background:BG,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:20,padding:24}} role="status" aria-live="polite">
        <div style={{fontSize:'2.8rem'}}>🧪</div>
        <div style={{display:'flex',gap:10}}>{[0,1,2].map(n=><div key={n} style={{width:12,height:12,borderRadius:'50%',background:'#e85d4a',animation:'dot 1.2s infinite',animationDelay:(n*.2)+'s'}}/>)}</div>
        <p style={{color:'#fff',fontWeight:700,fontSize:'1.05rem'}}>Генерую тест…</p>
        <p style={{color:'#8892b0',fontSize:'0.88rem'}}>Рівні: {testLabel} · {selAsp.length} аспектів</p>
      </div>
    );
    if(testPh==='error') return (
      <div style={{minHeight:'100vh',background:BG,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,padding:24}} role="alert">
        <div style={{fontSize:'2.5rem'}}>⚠️</div>
        <p style={{color:'#f87171',fontSize:'1.05rem',fontWeight:700}}>Помилка генерації тесту</p>
        <button onClick={()=>setScreen('setup')} style={{background:'#e85d4a',border:'none',borderRadius:13,padding:'13px 32px',color:'#fff',fontWeight:700,cursor:'pointer',fontSize:'1rem'}}>Спробувати знову</button>
      </div>
    );
    if(testPh==='report'&&report){
      const cc=CEFR_COLORS[report.cefr]||'#fff';
      const rAsp=[...new Set(qs.map(q=>q.aspect))].map(id=>ASPECTS_UI.find(a=>a.id===id)).filter(Boolean);
      return (
        <div style={{minHeight:'100vh',background:BG,paddingBottom:40}}>
          <Header onBack={()=>setScreen('home')} title="Результати тесту" badge={report.cefr} badgeColor={cc} techLogOn={tlOn}
            extra={<>
              <button onClick={expTxt} style={{background:'rgba(74,222,128,0.15)',border:'1px solid rgba(74,222,128,0.4)',borderRadius:9,padding:'6px 14px',color:'#4ade80',fontSize:'0.82rem',fontWeight:700,cursor:'pointer'}}>TXT</button>
              <button onClick={expJSON} style={{background:'rgba(74,158,222,0.15)',border:'1px solid rgba(74,158,222,0.4)',borderRadius:9,padding:'6px 14px',color:'#4a9ede',fontSize:'0.82rem',fontWeight:700,cursor:'pointer'}}>JSON</button>
            </>}
          />
          <div className="pw" style={{padding:'26px 16px 40px',display:'flex',flexDirection:'column',gap:20}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:'clamp(3rem,15vw,5rem)',color:cc,fontWeight:900,letterSpacing:-2,lineHeight:1}} aria-label={'CEFR рівень '+report.cefr}>{report.cefr}</div>
              <p style={{color:'#8892b0',fontSize:'0.9rem',marginTop:6}}>Рекомендований рівень CEFR</p>
              <p style={{color:'#4b5563',fontSize:'0.8rem',marginTop:2}}>Тест охоплював: {testLabel}</p>
              <div style={{marginTop:12,background:cc+'22',border:'1px solid '+cc+'44',borderRadius:12,padding:'8px 24px',display:'inline-block',color:cc,fontWeight:700,fontSize:'1rem'}}>Бал: {report.overall_score}/100</div>
            </div>
            {rAsp.length>=3&&(
              <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:20,padding:20}}>
                <p style={{color:'#fff',fontWeight:700,marginBottom:14,textAlign:'center',fontSize:'0.95rem'}}>Профіль компетенцій</p>
                <RadarChart scores={scores} aspects={rAsp}/>
              </div>
            )}
            <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:16,padding:18}}>
              {rAsp.map(a=>{
                const s=scores[a.id]||0;
                return (
                  <div key={a.id} style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                    <span style={{fontSize:'1.05rem'}} aria-hidden="true">{a.icon}</span>
                    <span style={{color:'#cbd5e1',fontSize:'0.9rem',width:96,flexShrink:0}}>{a.label}</span>
                    <div style={{flex:1,height:8,background:'rgba(255,255,255,0.09)',borderRadius:99}} role="progressbar" aria-valuenow={s} aria-valuemax={10} aria-label={a.label}>
                      <div style={{width:(s*10)+'%',height:'100%',background:a.color,borderRadius:99,transition:'width .6s ease'}}/>
                    </div>
                    <span style={{color:a.color,fontWeight:700,fontSize:'0.9rem',width:32,textAlign:'right'}}>{s}</span>
                  </div>
                );
              })}
            </div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              {[{key:'weak_aspects',label:'Слабкі місця',color:'#f87171',emoji:'⚠️'},{key:'strong_aspects',label:'Сильні сторони',color:'#4ade80',emoji:'✅'}].map(item=>(
                <div key={item.key} style={{flex:1,minWidth:130,background:'rgba(255,255,255,0.04)',border:'1px solid '+item.color+'33',borderRadius:14,padding:14}}>
                  <p style={{color:item.color,fontWeight:700,fontSize:'0.82rem',marginBottom:8}}>{item.emoji} {item.label}</p>
                  {!(report[item.key]&&report[item.key].length)?<p style={{color:'#8892b0',fontSize:'0.88rem'}}>—</p>
                    :report[item.key].map(id=>{const a=ASPECTS_UI.find(x=>x.id===id);return a?<p key={id} style={{color:'#cbd5e1',fontSize:'0.9rem',marginBottom:4}}>{a.icon} {a.label}</p>:null;})}
                </div>
              ))}
            </div>
            {(report.recommendations||[]).length>0&&(
              <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:16,padding:18}}>
                <p style={{color:'#fff',fontWeight:700,marginBottom:14,fontSize:'0.95rem'}}>Рекомендації</p>
                {report.recommendations.map((r,i)=>(
                  <div key={i} style={{display:'flex',gap:12,marginBottom:10}}>
                    <span style={{color:'#4a9ede',fontWeight:700,fontSize:'0.9rem',flexShrink:0}}>{i+1}.</span>
                    <span style={{color:'#cbd5e1',fontSize:'0.9rem',lineHeight:1.65}}>{r}</span>
                  </div>
                ))}
              </div>
            )}
            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              <button onClick={expTxt}  style={{flex:1,minWidth:130,background:'rgba(74,222,128,0.12)',border:'1px solid rgba(74,222,128,0.3)',borderRadius:12,padding:'14px',color:'#4ade80',fontWeight:700,cursor:'pointer',fontSize:'0.9rem'}}>⬇ TXT</button>
              <button onClick={expJSON} style={{flex:1,minWidth:130,background:'rgba(74,158,222,0.12)',border:'1px solid rgba(74,158,222,0.3)',borderRadius:12,padding:'14px',color:'#4a9ede',fontWeight:700,cursor:'pointer',fontSize:'0.9rem'}}>⬇ JSON</button>
            </div>
            <button onClick={()=>setScreen('home')} style={{background:'rgba(255,255,255,0.07)',border:'none',borderRadius:14,padding:'14px',color:'#8892b0',fontWeight:700,fontSize:'0.95rem',cursor:'pointer'}}>На головну</button>
          </div>
        </div>
      );
    }
    return (
      <div style={{minHeight:'100vh',background:BG,display:'flex',flexDirection:'column'}}>
        <Header onBack={()=>setScreen('home')} title={'🧪 Тест · '+testLabel} badge={curAsp?curAsp.icon+' '+curAsp.label:undefined} badgeColor={(curAsp||{}).color} techLogOn={tlOn}
          extra={<span style={{color:'#8892b0',fontSize:'0.8rem',marginLeft:'auto'}} aria-live="polite">{qi}/{qs.length}</span>}
        />
        <div style={{height:5,background:'rgba(255,255,255,0.07)',flexShrink:0}} role="progressbar" aria-valuenow={qi} aria-valuemax={Math.max(qs.length,1)}>
          <div style={{height:'100%',width:(qi/Math.max(qs.length,1)*100)+'%',background:(curAsp||{}).color||'#4a9ede',transition:'width .4s'}}/>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'22px 14px',display:'flex',flexDirection:'column',gap:16,alignItems:'center'}}>
          {testPh==='evaluating'&&(
            <div style={{display:'flex',gap:8,padding:'13px 20px',background:'rgba(255,255,255,0.05)',borderRadius:14}} role="status" aria-live="polite">
              {[0,1,2].map(n=><div key={n} style={{width:9,height:9,borderRadius:'50%',background:'#4a9ede',animation:'dot 1s infinite',animationDelay:(n*.2)+'s'}}/>)}
              <span style={{color:'#8892b0',fontSize:'0.9rem',marginLeft:8}}>AI оцінює відповідь…</span>
            </div>
          )}
          {qs[qi]&&(
            <QuestionCard key={qi} q={qs[qi]} idx={qi} total={qs.length}
              onAnswer={handleAns} answered={ansd} recording={rec} transcript={tr}
              speechError={se} fallbackText={ft} onStartRec={startRec} onStopRec={stopRec}
              onSetFallback={setFt} onSetSpeechError={setSe}
              onAudioPlay={()=>setQTtsReplays(v=>v+1)}/>
          )}
          {fb&&(
            <div role="alert" style={{maxWidth:600,width:'100%',background:fb.correct?'rgba(74,222,128,0.1)':'rgba(248,113,113,0.1)',border:'2px solid '+(fb.correct?'rgba(74,222,128,0.35)':'rgba(248,113,113,0.35)'),borderRadius:16,padding:18,animation:'fadeIn .3s ease'}}>
              <p style={{fontWeight:800,fontSize:'1rem',color:fb.correct?'#4ade80':'#f87171',marginBottom:8}}>{fb.correct?'✓ Правильно!':'✗ Неправильно'}</p>
              <p style={{color:'#cbd5e1',fontSize:'0.95rem',lineHeight:1.65}}>{fb.feedback}</p>
              {fb.error_analysis&&<p style={{color:'#8892b0',fontSize:'0.85rem',marginTop:8}}>{fb.error_analysis}</p>}
              {fb.pronunciationScores&&(
                <div style={{marginTop:12,padding:'10px 12px',background:'rgba(236,72,153,0.08)',borderRadius:10,border:'1px solid rgba(236,72,153,0.2)'}}>
                  <p style={{color:'#ec4899',fontWeight:700,fontSize:'0.82rem',marginBottom:8}}>🎤 Вимова</p>
                  {[{icon:'🎯',label:'Точність',val:fb.pronunciationScores.accuracyScore},{icon:'🌊',label:'Плавність',val:fb.pronunciationScores.fluencyScore},{icon:'✅',label:'Повнота',val:fb.pronunciationScores.completenessScore},{icon:'🎵',label:'Просодія',val:fb.pronunciationScores.prosodyScore}].filter(({val})=>val!=null).map(({icon,label,val})=>(
                    <div key={label} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                      <span style={{fontSize:'0.8rem',width:18}}>{icon}</span>
                      <span style={{color:'#94a3b8',fontSize:'0.78rem',width:68}}>{label}</span>
                      <div style={{flex:1,height:5,background:'rgba(255,255,255,0.1)',borderRadius:3,overflow:'hidden'}}>
                        <div style={{height:'100%',width:(val||0)+'%',background:val>=70?'#4ade80':val>=50?'#fbbf24':'#f87171',borderRadius:3,transition:'width .4s ease'}}/>
                      </div>
                      <span style={{color:'#cbd5e1',fontSize:'0.78rem',width:30,textAlign:'right'}}>{val||0}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ── ВИМОВА ────────────────────────────────────────── */
  if(screen==='pronunciation'){
    const PRON_COLOR = '#a78bfa';

    /* Допоміжні функції відображення */
    const scoreColor = s => s >= 80 ? '#4ade80' : s >= 50 ? '#fbbf24' : '#f87171';
    const verdictIcon = w => {
      if (w.errorType !== 'None') return '✗';
      if (w.accuracyScore >= 80) return '✓';
      if (w.accuracyScore >= 50) return '!';
      return '✗';
    };
    const verdictColor = w => {
      if (w.errorType !== 'None' || w.accuracyScore < 50) return '#f87171';
      if (w.accuracyScore < 80) return '#fbbf24';
      return '#4ade80';
    };

    /* Спіннер */
    const Spinner = ({text}) => (
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:18,padding:'48px 24px'}} role="status" aria-live="polite">
        <div style={{display:'flex',gap:10}}>
          {[0,1,2].map(n=><div key={n} style={{width:12,height:12,borderRadius:'50%',background:PRON_COLOR,animation:'dot 1.2s infinite',animationDelay:(n*.2)+'s'}}/>)}
        </div>
        <p style={{color:'#fff',fontWeight:700,fontSize:'1rem'}}>{text}</p>
      </div>
    );

    /* Агрегатні бали */
    const ScoreBar = ({label,value,color}) => (
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
        <span style={{color:'#cbd5e1',fontSize:'0.85rem',width:90,flexShrink:0}}>{label}</span>
        <div style={{flex:1,height:7,background:'rgba(255,255,255,0.09)',borderRadius:99}} role="progressbar" aria-valuenow={value} aria-valuemax={100}>
          <div style={{width:value+'%',height:'100%',background:color||scoreColor(value),borderRadius:99,transition:'width .5s ease'}}/>
        </div>
        <span style={{color:color||scoreColor(value),fontWeight:700,fontSize:'0.88rem',width:32,textAlign:'right'}}>{value}</span>
      </div>
    );

    return (
      <div style={{minHeight:'100vh',background:BG,display:'flex',flexDirection:'column'}}>
        <Header onBack={()=>setScreen('home')} title={'🗣 Вимова · '+sessLevel}
          badge={pronState==='done'?'✓ Звіт':pronState==='assessed'?'📊 Оцінено':undefined}
          badgeColor={PRON_COLOR} techLogOn={tlOn}/>

        <main style={{flex:1,overflowY:'auto',padding:'20px 16px 44px'}}>
          <div className="pw" style={{display:'flex',flexDirection:'column',gap:20,maxWidth:680,margin:'0 auto'}}>

            {/* ── IDLE: повернутись на вибір (якщо помилка або скидання) ── */}
            {pronState==='idle'&&(
              <div style={{textAlign:'center',padding:30}}>
                <p style={{color:'#8892b0',marginBottom:16}}>Виберіть джерело тексту на екрані налаштувань</p>
                <button onClick={()=>setScreen('setup')}
                  style={{background:'rgba(255,255,255,0.07)',border:'none',borderRadius:12,padding:'12px 24px',color:'#e8edf3',fontSize:'0.9rem',cursor:'pointer'}}>
                  ← Назад до налаштувань
                </button>
              </div>
            )}

            {/* ── GENERATING: спіннер ── */}
            {pronState==='generating'&&<Spinner text="Генерую текст…"/>}

            {/* ── TEXT_READY / RECORDING: показуємо текст ── */}
            {(pronState==='text_ready'||pronState==='recording')&&pronText&&(
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div style={{background:'rgba(255,255,255,0.05)',border:'2px solid rgba(167,139,250,0.3)',borderRadius:18,padding:'22px 20px'}}>
                  <p style={{color:'#8892b0',fontSize:'0.72rem',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:700,marginBottom:10}}>Текст для читання</p>
                  <p style={{color:'#e8edf3',fontSize:'1.15rem',lineHeight:1.85,letterSpacing:'.01em'}}>{pronText}</p>
                </div>

                {pronState==='text_ready'&&(
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>

                    {/* Кнопки: Послухати + Поради ШІ */}
                    <div style={{display:'flex',gap:8}}>
                      <button onClick={()=>speak(pronText, getLangConfig().speechLang)}
                        style={{flex:1,padding:'13px 8px',borderRadius:12,border:'1px solid rgba(255,255,255,0.14)',background:'rgba(255,255,255,0.06)',color:'#e8edf3',fontSize:'0.9rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                        🔊 Послухати
                      </button>
                      <button onClick={getPronComment} disabled={pronCommentLoading}
                        style={{flex:1,padding:'13px 8px',borderRadius:12,border:'1px solid rgba(255,255,255,0.14)',background:'rgba(255,255,255,0.06)',color:'#e8edf3',fontSize:'0.9rem',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:6,opacity:pronCommentLoading?0.6:1}}>
                        {pronCommentLoading?'⏳ Аналізую…':'💡 Поради ШІ'}
                      </button>
                    </div>

                    {/* AI-коментар */}
                    {pronComment&&(
                      <div style={{background:'rgba(167,139,250,0.08)',border:'1px solid rgba(167,139,250,0.22)',borderRadius:12,padding:'13px 15px',color:'#c4b5fd',fontSize:'0.87rem',lineHeight:1.7}}>
                        {pronComment}
                      </div>
                    )}

                    <p style={{color:'#8892b0',fontSize:'0.88rem',textAlign:'center',marginTop:4}}>Прочитайте текст вголос чітко та природньо</p>
                    <button onClick={startPronAssessment}
                      style={{background:PRON_COLOR,border:'none',borderRadius:16,padding:'16px',color:'#fff',fontSize:'1rem',fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:10}}>
                      🎙 Почати запис
                    </button>
                    <button onClick={()=>{setPronText('');setPronState('idle');}}
                      style={{background:'rgba(255,255,255,0.07)',border:'none',borderRadius:12,padding:'12px',color:'#8892b0',fontSize:'0.9rem',cursor:'pointer'}}>
                      ← Змінити текст
                    </button>
                  </div>
                )}

                {pronState==='recording'&&(
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}} role="status" aria-live="polite">
                    <div style={{width:60,height:60,borderRadius:'50%',background:'rgba(167,139,250,0.15)',border:'3px solid '+PRON_COLOR,display:'flex',alignItems:'center',justifyContent:'center',animation:'pronPulse 1.5s ease-in-out infinite'}}>
                      <span style={{fontSize:'1.6rem'}}>🎙</span>
                    </div>
                    <p style={{color:PRON_COLOR,fontWeight:700,fontSize:'1rem'}}>Слухаю… говоріть текст</p>
                    <p style={{color:'#8892b0',fontSize:'0.85rem'}}>Читайте весь текст від початку до кінця</p>
                  </div>
                )}
              </div>
            )}

            {/* ── ASSESSED: таблиця + агрегатні бали ── */}
            {(pronState==='assessed'||pronState==='analyzing'||pronState==='done')&&pronScores&&(
              <div style={{display:'flex',flexDirection:'column',gap:18}}>

                {/* Агрегатні бали */}
                <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:16,padding:'18px 20px'}}>
                  <p style={{color:'#fff',fontWeight:700,fontSize:'0.9rem',marginBottom:14}}>📊 Загальні результати</p>
                  <ScoreBar label="Точність"   value={pronScores.accuracyScore}/>
                  <ScoreBar label="Плавність"  value={pronScores.fluencyScore}/>
                  <ScoreBar label="Повнота"    value={pronScores.completenessScore}/>
                  <ScoreBar label="Загальний"  value={pronScores.pronunciationScore} color={PRON_COLOR}/>
                  {pronScores.transcript&&<p style={{marginTop:12,color:'#8892b0',fontSize:'0.82rem'}}>📝 Розпізнано: <span style={{color:'#cbd5e1'}}>{pronScores.transcript}</span></p>}
                </div>

                {/* Таблиця слів */}
                {pronWords.length>0&&(
                  <div style={{background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.08)',borderRadius:16,overflow:'hidden'}}>
                    <p style={{color:'#fff',fontWeight:700,fontSize:'0.9rem',padding:'14px 18px',borderBottom:'1px solid rgba(255,255,255,0.07)'}}>🔤 Пословна оцінка</p>
                    <div style={{overflowX:'auto'}}>
                      <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.88rem'}}>
                        <thead>
                          <tr style={{background:'rgba(255,255,255,0.05)'}}>
                            {[
                              {h:'Слово',          title:'Розпізнане слово'},
                              {h:'Точність',        title:'Загальна точність вимови слова (0–100%)'},
                              {h:'Точн. складів',   title:'Середня точність вимови кожного складу слова'},
                              {h:'Фонеми (сер.)',   title:'Середня точність вимови всіх фонем (звуків) слова'},
                              {h:'Фонеми (мін.)',   title:'Найнижчий бал серед фонем — найпроблемніший звук'},
                              {h:'Тип помилки',     title:'None — правильно; Mispronunciation — неправильна вимова; Omission — слово пропущено; Insertion — зайве слово'},
                              {h:'Проблемні звуки', title:'Конкретні фонеми з балом нижче 65%'},
                              {h:'✓',               title:'Загальний вердикт: ✓ добре / ! прийнятно / ✗ помилка'},
                            ].map(({h,title})=>(
                              <th key={h} title={title} style={{padding:'10px 14px',color:'#8892b0',fontWeight:700,textAlign:'left',whiteSpace:'nowrap',cursor:'help'}}>{h}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {pronWords.map((w,i)=>(
                            <tr key={i} style={{borderBottom:'1px solid rgba(255,255,255,0.05)',background:i%2===0?'transparent':'rgba(255,255,255,0.02)'}}>
                              <td style={{padding:'9px 14px',color:'#e8edf3',fontWeight:600}}>{w.word}</td>
                              <td style={{padding:'9px 14px',color:scoreColor(w.accuracyScore),fontWeight:700}}>{w.accuracyScore}%</td>
                              <td style={{padding:'9px 14px',color:w.syllableAvg!=null?scoreColor(w.syllableAvg):'#4b5563',fontWeight:600}}>{w.syllableAvg!=null?w.syllableAvg+'%':'—'}</td>
                              <td style={{padding:'9px 14px',color:w.phonemeAvg!=null?scoreColor(w.phonemeAvg):'#4b5563',fontWeight:600}}>{w.phonemeAvg!=null?w.phonemeAvg+'%':'—'}</td>
                              <td style={{padding:'9px 14px',color:w.phonemeMin!=null?scoreColor(w.phonemeMin):'#4b5563',fontWeight:600}}>{w.phonemeMin!=null?w.phonemeMin+'%':'—'}</td>
                              <td style={{padding:'9px 14px',color:w.errorType==='None'?'#4b5563':'#fbbf24',fontSize:'0.82rem'}}>{w.errorType}</td>
                              <td style={{padding:'9px 14px',color:'#f87171',fontSize:'0.8rem',maxWidth:140}}>{(w.badPhonemes&&w.badPhonemes.length)?w.badPhonemes.join(', '):'—'}</td>
                              <td style={{padding:'9px 14px',color:verdictColor(w),fontWeight:800,fontSize:'1rem',textAlign:'center'}}>{verdictIcon(w)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* Кнопки після оцінки */}
                {pronState==='assessed'&&(
                  <div style={{display:'flex',flexDirection:'column',gap:10}}>
                    <button onClick={analyzePronunciation}
                      style={{background:PRON_COLOR,border:'none',borderRadius:14,padding:'15px',color:'#fff',fontWeight:700,cursor:'pointer',fontSize:'1rem',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
                      📊 Аналізувати вимову
                    </button>
                    <button onClick={()=>{setPronState('text_ready');setPronWords([]);setPronScores(null);}}
                      style={{background:'rgba(255,255,255,0.07)',border:'none',borderRadius:12,padding:'12px',color:'#8892b0',fontSize:'0.9rem',cursor:'pointer'}}>
                      🔄 Записати знову
                    </button>
                  </div>
                )}

                {/* Аналіз: спіннер */}
                {pronState==='analyzing'&&<Spinner text="Аналізую результати…"/>}

                {/* Звіт */}
                {pronState==='done'&&pronReport&&(
                  <div style={{display:'flex',flexDirection:'column',gap:14}}>
                    <div style={{background:'rgba(167,139,250,0.07)',border:'2px solid rgba(167,139,250,0.25)',borderRadius:16,padding:'20px'}}>
                      <p style={{color:PRON_COLOR,fontWeight:700,fontSize:'0.9rem',marginBottom:12}}>🤖 Аналіз AI</p>
                      <div style={{color:'#cbd5e1',fontSize:'0.95rem',lineHeight:1.75,whiteSpace:'pre-wrap'}}>{pronReport}</div>
                    </div>
                    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                      <button onClick={downloadPronReport}
                        style={{flex:1,minWidth:140,background:'rgba(74,222,128,0.15)',border:'2px solid rgba(74,222,128,0.4)',borderRadius:12,padding:'13px',color:'#4ade80',fontWeight:700,cursor:'pointer',fontSize:'0.9rem'}}>
                        ⬇ Завантажити звіт
                      </button>
                      <button onClick={()=>{setPronState('idle');setPronText('');setPronWords([]);setPronScores(null);setPronReport('');}}
                        style={{flex:1,minWidth:140,background:'rgba(255,255,255,0.07)',border:'none',borderRadius:12,padding:'13px',color:'#8892b0',fontWeight:700,cursor:'pointer',fontSize:'0.9rem'}}>
                        🔄 Нова вправа
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

          </div>
        </main>
      </div>
    );
  }

  /* SESSION */
  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:BG}}>
      <Header onBack={async ()=>{
          if(nadRef.current){
            // Автозбереження якщо запис активний
            if(nadRecording){
              setNadRecording(false);
              const sessId = sessRef.current || Date.now().toString(36);
              await nadRef.current.saveRecording(sessId).catch(()=>{});
            }
            nadRef.current.disconnect(); nadRef.current=null;
          }
          setNadState('idle');
          setScreen('home');
        }} title={mode.icon+' '+mode.label} badge={testLabel} badgeColor={'#4a9ede'} techLogOn={tlOn}
        extra={<>
          {mode.id==='chat'&&topic&&<span style={{color:'#8892b0',fontSize:'0.8rem'}}>· {topic}</span>}
          {mode.id==='chat'&&msgs.length>0&&(
            <button onClick={expRTF} style={{background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.15)',borderRadius:9,padding:'5px 12px',color:'#8892b0',fontSize:'0.8rem',fontWeight:600,cursor:'pointer'}}>⬇ RTF</button>
          )}
          {mode.id==='chat'&&!nadOn&&(
            <div style={{display:'flex',gap:5}}>
              {[{k:'t',v:showTxt,s:setShowTxt,ic:'👁',lb:'Текст'},{k:'c',v:showCor,s:setShowCor,ic:'✏',lb:'Корекція'},{k:'r',v:showRem,s:setShowRem,ic:'💬',lb:'Ремарки'}].map(({k,v,s,ic,lb})=>(
                <button key={k} onClick={()=>s(x=>!x)} aria-pressed={v} aria-label={lb}
                  style={{display:'flex',alignItems:'center',gap:4,background:v?mode.color+'22':'rgba(255,255,255,0.06)',border:'1px solid '+(v?mode.color+'66':'rgba(255,255,255,0.12)'),borderRadius:9,padding:'5px 8px',cursor:'pointer',transition:'all .2s'}}>
                  <span style={{fontSize:'0.85rem'}}>{ic}</span>
                  <span style={{color:v?mode.color:'#8892b0',fontSize:'0.7rem',fontWeight:700}}>{lb}</span>
                </button>
              ))}
            </div>
          )}
        </>}
      />

      {/* Чат */}
      <div style={{flex:1,overflowY:'auto',padding:'16px 14px',display:'flex',flexDirection:'column',gap:11}} role="log" aria-label="Розмова" aria-live="polite">
        {msgs.map((msg,i)=>(
          <div key={i} style={{display:'flex',flexDirection:'column',alignItems:msg.role==='user'?'flex-end':'flex-start',gap:6,animation:'fadeIn .25s ease'}}>
            <div style={{display:'flex',alignItems:'flex-end',gap:5,flexDirection:msg.role==='user'?'row-reverse':'row'}}>
              <div style={{maxWidth:'min(84%,540px)',
                background: msg.isHint ? 'rgba(251,191,36,0.08)' : msg.role==='user'?'linear-gradient(135deg,'+mode.color+'cc,'+mode.color+'88)':'rgba(255,255,255,0.07)',
                border: msg.isHint ? '1px solid rgba(251,191,36,0.3)' : '1px solid rgba(255,255,255,0.07)',
                borderRadius:msg.role==='user'?'18px 18px 4px 18px':'18px 18px 18px 4px',
                padding:'12px 15px',
                color: msg.isHint ? '#fbbf24' : '#e8edf3',
                fontSize:'0.95rem',lineHeight:1.7,whiteSpace:'pre-wrap'}}>
                {mode.id==='chat'&&msg.role==='ai'
                  ?(msg.nad
                    ?(nadShowText
                      ? <>{msg.isHint&&<span style={{fontSize:'0.8rem',marginRight:6,opacity:.7}}>💡</span>}{msg.content}{msg.streaming&&<span style={{display:'inline-block',width:'2px',height:'1em',background: msg.isHint?'#fbbf24':'#4a9ede',marginLeft:2,verticalAlign:'text-bottom',animation:'dot 0.8s infinite'}}/>}</>
                      : <span style={{color:'#8892b0',fontSize:'0.88rem',fontStyle:'italic'}}>🔊 AI говорить… (увімкніть 👁 для тексту)</span>)
                    :(showTxt?msg.content:<span style={{color:'#8892b0',fontSize:'0.88rem',fontStyle:'italic'}}>🔊 Аудіо відтворюється…</span>))
                  :msg.content}
              </div>
              {/* 🔁 для звичайного TTS */}
              {msg.role==='ai'&&msg.ttsText&&!msg.error&&!nadOn&&(
                <button onClick={()=>speak(msg.ttsText)} aria-label="Прослухати знову" title="Повторити"
                  style={{flexShrink:0,width:28,height:28,minWidth:28,minHeight:28,borderRadius:'50%',border:'1px solid rgba(255,255,255,0.13)',background:'rgba(255,255,255,0.06)',color:'#8892b0',cursor:'pointer',fontSize:'0.78rem',display:'flex',alignItems:'center',justifyContent:'center',alignSelf:'flex-end',marginBottom:2,transition:'background .15s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.13)'}
                  onMouseLeave={e=>e.currentTarget.style.background='rgba(255,255,255,0.06)'}>
                  🔁
                </button>
              )}
              {/* 🔁 для NAD — просить Gemini повторити фразу голосом */}
              {msg.role==='ai'&&msg.nad&&msg.content&&msg.final&&(
                <button onClick={repeatLast} aria-label="Повторити" title="Попросити AI повторити"
                  style={{flexShrink:0,width:28,height:28,minWidth:28,minHeight:28,borderRadius:'50%',border:'1px solid rgba(74,158,222,0.35)',background:'rgba(74,158,222,0.1)',color:'#4a9ede',cursor:'pointer',fontSize:'0.78rem',display:'flex',alignItems:'center',justifyContent:'center',alignSelf:'flex-end',marginBottom:2,transition:'background .15s'}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(74,158,222,0.22)'}
                  onMouseLeave={e=>e.currentTarget.style.background='rgba(74,158,222,0.1)'}>
                  🔁
                </button>
              )}
            </div>
            {msg.correction&&msg.role==='user'&&(showCor||showRem)&&(
              <div style={{maxWidth:'min(84%,540px)',background:'rgba(255,255,255,0.04)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:12,padding:'10px 14px',fontSize:'0.88rem'}}>
                {msg.correction.has_errors?(
                  <>
                    {showCor&&(msg.correction.corrections||[]).map((c,ci)=>(
                      <div key={ci} style={{marginBottom:4,lineHeight:1.55}}>
                        <span style={{color:'#f87171',textDecoration:'line-through'}}>{c.wrong}</span>
                        <span style={{color:'#8892b0',margin:'0 6px'}}>→</span>
                        <span style={{color:'#4ade80'}}>{c.right}</span>
                        {showRem&&c.note&&<span style={{color:'#8892b0',marginLeft:8,fontSize:'0.8rem'}}>({c.note})</span>}
                      </div>
                    ))}
                    {showRem&&msg.correction.overall&&(
                      <p style={{color:'#8892b0',marginTop:6,paddingTop:6,borderTop:'1px solid rgba(255,255,255,0.07)',fontSize:'0.85rem'}}>{msg.correction.overall}</p>
                    )}
                  </>
                ):(showRem&&<p style={{color:'#4ade80',fontSize:'0.88rem'}}>{msg.correction.overall||'✓ Без помилок!'}</p>)}
              </div>
            )}
          </div>
        ))}
        {loading&&(
          <div style={{display:'flex'}} role="status" aria-label="AI відповідає">
            <div style={{background:'rgba(255,255,255,0.07)',borderRadius:'18px 18px 18px 4px',padding:'13px 16px',display:'flex',gap:6,alignItems:'center'}}>
              {[0,1,2].map(n=><div key={n} style={{width:7,height:7,borderRadius:'50%',background:mode.color,animation:'dot 1.2s infinite',animationDelay:(n*.2)+'s'}}/>)}
            </div>
          </div>
        )}
        <div ref={botRef}/>
      </div>

      {/* Введення */}
      <div style={{padding:'10px 12px 14px',borderTop:'1px solid rgba(255,255,255,0.08)',background:'rgba(0,0,0,0.5)',flexShrink:0,backdropFilter:'blur(8px)'}}>
        {/* NAD режим — Push-and-Hold кнопка по центру */}
        {mode.id==='chat'&&nadOn?(
          <div style={{maxWidth:720,margin:'0 auto',display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>

            {/* Рядок статусу */}
            <div style={{fontSize:'0.8rem',color:nadState==='listening'?'#4ade80':nadState==='speaking'?'#4a9ede':nadState==='connecting'?'#fbbf24':nadState==='error'?'#f87171':'#4b5563',fontWeight:600,letterSpacing:'0.03em'}}>
              {nadState==='connecting'?'⏳ Підключення…':nadState==='ready'?('● Утримуйте кнопку і говоріть ' + _LC.targetInstr):nadState==='listening'?'🎙 Запис… відпустіть коли закінчите':nadState==='speaking'?'🔊 AI відповідає…':nadState==='error'?'❌ Помилка':'●'}
            </div>

            {/* Push-and-Hold кнопка по центру */}
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <button
                onMouseDown={pttStart} onMouseUp={pttStop} onMouseLeave={pttStop}
                onTouchStart={e=>{e.preventDefault();pttStart();}} onTouchEnd={pttStop}
                disabled={nadState!=='ready'&&nadState!=='listening'}
                aria-pressed={nadState==='listening'}
                title={'Утримуйте і говоріть ' + _LC.targetInstr}
                style={{
                  position:'relative',
                  width:80,height:80,borderRadius:'50%',
                  border: nadState==='listening'
                    ? '3px solid #4ade80'
                    : nadState==='speaking'
                      ? '3px solid #4a9ede'
                      : '3px solid rgba(255,255,255,0.2)',
                  background: nadState==='listening'
                    ? 'rgba(74,222,128,0.18)'
                    : nadState==='speaking'
                      ? 'rgba(74,158,222,0.12)'
                      : 'rgba(255,255,255,0.06)',
                  color: nadState==='listening'?'#4ade80':nadState==='speaking'?'#4a9ede':'#6b7280',
                  fontSize:'2rem',
                  cursor:(nadState!=='ready'&&nadState!=='listening')?'default':'pointer',
                  transition:'all .15s',
                  boxShadow: nadState==='listening'?'0 0 24px rgba(74,222,128,0.35)':'none',
                  userSelect:'none', WebkitUserSelect:'none',
                  display:'flex',alignItems:'center',justifyContent:'center',
                }}>
                {/* Пульсуюче кільце під час запису */}
                {nadState==='listening'&&(
                  <div style={{position:'absolute',inset:-4,borderRadius:'50%',border:'2px solid rgba(74,222,128,0.4)',animation:'dot 1.2s ease-in-out infinite'}}/>
                )}
                {nadState==='speaking'?'🔊':nadState==='connecting'?'⏳':nadState==='error'?'❌':'🎙'}
              </button>

              {/* Кнопка запису — окремо справа */}
              {(()=>{ const m=(typeof CHAT_CONFIG!=='undefined'?CHAT_CONFIG.nad?.recordingMode:'off'); return m!=='button'||true; })()&&(
                <button
                  onClick={(typeof CHAT_CONFIG!=='undefined'&&CHAT_CONFIG.nad?.recordingMode)==='auto' ? undefined : toggleRecording}
                  aria-pressed={nadRecording}
                  title={
                    (typeof CHAT_CONFIG!=='undefined'&&CHAT_CONFIG.nad?.recordingMode)==='auto'
                      ? (nadRecording?'Запис іде…':'Запис вимкнено')
                      : (nadRecording?'Зупинити запис і зберегти':'Почати запис діалогу')
                  }
                  style={{
                    display:'flex',flexDirection:'column',alignItems:'center',gap:4,
                    padding:'8px 12px',borderRadius:10,
                    border:'1px solid '+(nadRecording?'rgba(239,68,68,0.5)':'rgba(255,255,255,0.12)'),
                    background:nadRecording?'rgba(239,68,68,0.1)':'rgba(255,255,255,0.04)',
                    color:nadRecording?'#ef4444':'#4b5563',
                    fontSize:'0.75rem',fontWeight:700,
                    cursor:(typeof CHAT_CONFIG!=='undefined'&&CHAT_CONFIG.nad?.recordingMode)==='auto'?'default':'pointer',
                    transition:'all .2s',
                  }}>
                  <span style={{width:10,height:10,borderRadius:'50%',background:nadRecording?'#ef4444':'#4b5563',display:'block',outline:nadRecording?'3px solid rgba(239,68,68,0.25)':'none',outlineOffset:2,animation:nadRecording?'nadRecPulse 1.2s ease-in-out infinite':'none'}}/>
                  {(typeof CHAT_CONFIG!=='undefined'&&CHAT_CONFIG.nad?.recordingMode)==='auto'
                    ? (nadRecording?'REC':'rec')
                    : (nadRecording?'Стоп':'Rec')}
                </button>
              )}
            </div>

            {nadErr&&<p role="alert" style={{color:'#f87171',fontSize:'0.8rem',textAlign:'center',marginTop:2}}>Помилка підключення. Перевірте API ключ.</p>}
          </div>
        ):(
          /* Стандартне введення (без змін) */
          <div style={{display:'flex',gap:8,alignItems:'flex-end',maxWidth:720,margin:'0 auto'}}>
            {mode.id==='chat'&&(
              <button onClick={chatRec?stopCRec:startCRec} disabled={loading} aria-pressed={chatRec}
                aria-label={chatRec?'Зупинити запис':'Голосовий ввід'}
                style={{width:46,height:46,borderRadius:12,border:'2px solid '+(chatRec?'#ec4899':chatErr?'#f87171':'rgba(255,255,255,0.16)'),background:chatRec?'rgba(236,72,153,.2)':chatErr?'rgba(248,113,113,.1)':'rgba(255,255,255,0.06)',color:chatRec?'#ec4899':chatErr?'#f87171':'#8892b0',fontSize:'1.15rem',cursor:loading?'default':'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {chatRec?'⏹':'🎤'}
              </button>
            )}
            <textarea ref={inpRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={onKey}
              placeholder={mode.id==='chat'?('Пиши ' + _LC.targetInstr + '…'):'Твоя відповідь…'}
              aria-label={mode.id==='chat'?('Повідомлення ' + _LC.targetInstr):'Відповідь'}
              rows={1}
              style={{flex:1,background:'rgba(255,255,255,0.08)',border:'2px solid rgba(255,255,255,0.16)',borderRadius:12,padding:'12px 14px',color:'#fff',fontSize:'0.95rem',resize:'none',outline:'none',lineHeight:1.55,minHeight:46}}/>
            <button onClick={sendMsg} disabled={loading||!input.trim()} aria-label="Надіслати"
              style={{background:input.trim()&&!loading?mode.color:'rgba(255,255,255,0.08)',border:'none',borderRadius:12,width:46,height:46,color:'#fff',fontSize:'1.2rem',cursor:input.trim()&&!loading?'pointer':'default',flexShrink:0}}>↑</button>
          </div>
        )}
        {!nadOn&&chatRec&&(
          <div style={{display:'flex',alignItems:'center',gap:7,marginTop:7,justifyContent:'center'}} aria-live="assertive">
            {[0,1,2].map(n=><div key={n} style={{width:6,height:6,borderRadius:'50%',background:'#ec4899',animation:'dot .8s infinite',animationDelay:(n*.15)+'s'}}/>)}
            <span style={{color:'#ec4899',fontSize:'0.82rem'}}>{'Запис ' + _LC.targetInstr + '…'}</span>
          </div>
        )}
        {!nadOn&&chatErr&&<p role="alert" style={{color:'#f87171',fontSize:'0.82rem',marginTop:5,textAlign:'center'}}>Мікрофон недоступний — введіть текст вручну</p>}
        {!nadOn&&<p style={{color:'#374151',fontSize:'0.75rem',marginTop:6,textAlign:'center'}} aria-hidden="true">Enter — надіслати · Shift+Enter — новий рядок</p>}
      </div>
    </div>
  );

}


(async () => {
    if (typeof loadCentralSettings === 'function') await loadCentralSettings();
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script>
</body>
</html>
